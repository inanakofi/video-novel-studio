[project]
name = "video-novel-studio"
version = "1.2.0"
description = "Offline desktop studio for narrated vertical story videos"
requires-python = ">=3.10"
dependencies = ["Pillow>=11.0,<13", "PySide6>=6.8,<7"]

[project.scripts]
video-novel-studio = "src.app:main"
video-novel-studio-mcp = "src.studio_mcp:main"

[project.optional-dependencies]
integrations = ["mcp==2.3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src", "src.*"]
